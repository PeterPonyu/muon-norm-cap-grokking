name: Warehouse contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Warehouse contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-ci.txt
      - name: Run contract tests
        run: python -m pytest tests/ -q --tb=short
      - name: Build portal site (Next.js export)
        run: bash portal/build.sh
