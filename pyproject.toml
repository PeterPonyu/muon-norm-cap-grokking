[project]
name = "muon-norm-cap-grokking-ci"
version = "0.0.0"
description = "CI helpers for the Paper A warehouse figure-pointer contract"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.0",
  "PyYAML>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["tests", "tools"]
extend-exclude = ["experiments"]

[tool.mypy]
python_version = "3.11"
files = ["tests", "tools"]
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
pretty = true
